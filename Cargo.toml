[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OxideOps/chess"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = { version = "0.30", features = ["serde"] }
thiserror = "2"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
ts-rs = { version = "12", features = ["serde-compat"] }

# Also what wasm-pack builds chess-core-wasm with; it then runs wasm-opt -Oz.
[profile.release]
opt-level = 3
lto = "thin"
