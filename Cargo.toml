[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OxideOps/chess"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = { version = "0.30", features = ["serde"] }
thiserror = "2"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
ts-rs = { version = "12", features = ["serde-compat"] }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tokio-tungstenite = "0.30"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"
tempfile = "3"

# Also what wasm-pack builds chess-core-wasm with; it then runs wasm-opt -Oz.
[profile.release]
opt-level = 3
lto = "thin"
