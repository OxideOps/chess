[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/OxideOps/chess"

[workspace.dependencies]
chess-core = { path = "crates/chess-core" }
dioxus = { version = "0.7.10", features = ["router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shakmaty = { version = "0.30", features = ["serde"] }
thiserror = "2"
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false }
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.release]
opt-level = 3
lto = "thin"

# Smaller, faster WASM for the web build.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
