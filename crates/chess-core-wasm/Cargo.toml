[package]
name = "chess-core-wasm"
description = "wasm-bindgen wrapper around chess-core for the SvelteKit client. The only crate that knows about JavaScript."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Derive TypeScript bindings for the view types (`cargo test --features ts` writes them).
ts = ["dep:ts-rs", "chess-core/ts"]

[dependencies]
chess-core.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
