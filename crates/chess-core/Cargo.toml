[package]
name = "chess-core"
description = "Chess rules, game history, and the client/server protocol shared by every part of the app. No UI or I/O dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Derive TypeScript bindings for the protocol types (`cargo test --features ts` writes them).
ts = ["dep:ts-rs"]

[dependencies]
serde.workspace = true
shakmaty.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
