[package]
name = "server"
description = "The chess server: serves the built web client today; will own games, clocks and move validation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "chess-server"
path = "src/main.rs"

[features]
# Derive TypeScript bindings for the JSON the client sees (`pnpm gen:types`).
ts = ["dep:ts-rs", "chess-core/ts"]

[dependencies]
argon2.workspace = true
axum.workspace = true
axum-extra.workspace = true
chess-core.workspace = true
getrandom.workspace = true
clap.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs = { workspace = true, optional = true }
uuid.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
sha2 = "0.11.0"
base64 = "0.23.1"
url = "2.5.8"
csv = "1.4.0"
# Email over plain SMTP, with rustls (the same aws-lc provider reqwest uses)
# rather than native-tls, so the image needs no OpenSSL.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }

[dev-dependencies]
http-body-util.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
