version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (dependabot #18).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      svelte:
        patterns: ["svelte", "@sveltejs/*", "vite", "@vitest/*", "vitest*", "playwright", "@playwright/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["svelte", "@sveltejs/*", "vite", "@vitest/*", "vitest*", "playwright", "@playwright/*"]
