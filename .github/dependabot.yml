version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # Dioxus breaks its API every minor release; upgrade it deliberately, on its own.
      dioxus:
        patterns: ["dioxus*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["dioxus*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      svelte:
        patterns: ["svelte", "@sveltejs/*", "vite", "@vitest/*", "vitest*", "playwright", "@playwright/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["svelte", "@sveltejs/*", "vite", "@vitest/*", "vitest*", "playwright", "@playwright/*"]
